name: Verify Kotlin Multiplatform

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spake2-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew --no-daemon jvmTest linuxX64Test jsNodeTest wasmJsNodeTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew --no-daemon -PenableAndroid=true assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-unit-tests
          path: |
            **/build/outputs/aar/**
            **/build/test-results/**
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run the native iOS simulator target for the runner architecture
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            ./gradlew --no-daemon iosSimulatorArm64Test
          else
            ./gradlew --no-daemon iosX64Test
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-test-results
          path: '**/build/test-results/**'
          retention-days: 14
