name: Verify Kotlin Multiplatform

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spake2-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify evidence gates fail closed
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 -O -m unittest discover -s tools/tests -v
      - run: ./gradlew --no-daemon jvmTest linuxX64Test jsNodeTest wasmJsNodeTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew --no-daemon -PenableAndroid=true assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-unit-tests
          path: |
            **/build/outputs/aar/**
            **/build/test-results/**
          retention-days: 14

  darwin:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run the native iOS simulator target for the runner architecture
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            ./gradlew --no-daemon compileKotlinIosArm64 macosArm64Test iosSimulatorArm64Test
          else
            ./gradlew --no-daemon compileKotlinIosArm64 macosX64Test iosX64Test
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: darwin-test-results-${{ matrix.runner }}
          path: '**/build/test-results/**'
          retention-days: 14
